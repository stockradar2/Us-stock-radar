
name: US Stock Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * 1-5'

permissions:
  contents: read
  actions: write

concurrency:
  group: us-stock-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install requests

      - name: Restore alert history
        uses: actions/cache/restore@v4
        with:
          path: alert_state.json
          key: radar-alerts-${{ github.run_id }}
          restore-keys: |
            radar-alerts-

      - name: Run stock scanner
        run: python scanner.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      
      - name: Ensure alert history file exists
        if: success()
        run: |
          if [ ! -f alert_state.json ]; then
            echo '{}' > alert_state.json
          fi



      - name: Save alert history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: alert_state.json
          key: radar-alerts-${{ github.run_id }}
